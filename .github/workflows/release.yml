name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build dashboard into the package
        run: npm --prefix web ci && npm --prefix web run build
      - run: python -m build
      - name: Check version matches tag
        run: |
          v=$(python -c "import auctionsi; print(auctionsi.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "version $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" dist/* --title "AuctionSI ${GITHUB_REF_NAME}" --notes "$notes"
      - name: Publish to PyPI (when enabled with the PYPI_PUBLISH repository variable)
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -f tag="${GITHUB_REF_NAME}"
