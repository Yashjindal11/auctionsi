name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, property and docs tests
        run: pytest -m "not integration"
      - name: Integration tests
        run: pytest -m integration
      - name: Examples run
        run: python scripts/run_examples.py

  coverage-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auctionsi
          POSTGRES_PASSWORD: auctionsi
          POSTGRES_DB: auctionsi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auctionsi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUCTIONSI_TEST_POSTGRES: postgresql://auctionsi:auctionsi@localhost:5432/auctionsi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Full suite with PostgreSQL and a coverage gate
        run: pytest --cov --cov-report=term --cov-fail-under=93

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dashboard tests
        run: npm test
      - name: Type check and build dashboard
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, coverage-and-postgres, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dashboard into the package
        run: npm --prefix web ci && npm --prefix web run build
      - run: pip install build
      - run: python -m build
      - name: Install wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/clean/bin/auctionsi --version
          /tmp/clean/bin/auctionsi init /tmp/proj
          cd /tmp/proj
          /tmp/clean/bin/auctionsi agent register agents.yaml
          /tmp/clean/bin/auctionsi task submit task.yaml || test $? -eq 1
          /tmp/clean/bin/auctionsi market simulate --agents 10 --tasks 50
          /tmp/clean/bin/python -c "import auctionsi, pathlib; assert (pathlib.Path(auctionsi.__file__).parent / 'api/static/index.html').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - name: Dependency audit
        run: pip-audit --skip-editable
